name: job-radar

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (public repo = unlimited free minutes; GitHub may start runs a few minutes late)
  workflow_dispatch: {}       # "Run workflow" button for manual runs

concurrency:
  group: job-radar
  cancel-in-progress: false

permissions:
  contents: write             # needed to commit state/state.json back

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run job radar
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED || 'false' }}
        run: python -m jobradar

      - name: Save state (so the next run skips jobs already seen)
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add state/state.json
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "state: update seen jobs [skip ci]"
            git pull --rebase --quiet
            git push
          fi

      - name: Keep latest digest as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: out/
          retention-days: 3
          if-no-files-found: ignore
