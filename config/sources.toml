# llm4jobs v2 configuration.
# Disable a source with `enabled = false` (or delete the block).

[settings]
max_age_days = 3            # only consider jobs posted in the last N days
max_years = 2               # drop jobs requiring more than this many years
us_only = true
remote_counts_as_us = true  # a bare "Remote" location counts as US
include_internships = false
llm_fallback = true         # ask gpt-4o-mini only when no "N years" is found in the text
llm_model = "gpt-4o-mini"
llm_max_calls = 60          # hard cap per run (cost guard)

# A title must contain one of these to be kept. Empty list = keep every role type.
role_keywords = [
  "engineer", "engineering", "developer", "software", "swe", "sde", "programmer",
  "data", "analytics", "analyst", "machine learning", "ml", "ai", "scientist", "research",
  "researcher", "sre", "reliability", "devops", "security", "infrastructure", "platform",
  "backend", "back end", "back-end", "frontend", "front end", "front-end", "full stack",
  "full-stack", "fullstack", "mobile", "ios", "android", "cloud", "systems", "firmware",
  "embedded", "hardware", "quant", "quantitative", "product manager", "technical program",
  "solutions", "forward deployed", "new grad", "graduate", "early career", "university",
]
# A title containing any of these is dropped even if it matched above.
role_exclude = [
  "recruiter", "recruiting", "sourcer", "talent acquisition", "account executive",
  "sales development", "business development", "legal", "counsel", "paralegal", "attorney",
  "accountant", "payroll", "executive assistant",
]

